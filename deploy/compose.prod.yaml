name: neodomus-prod

services:
  web:
    image: neodomus-web:1.0.0
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    image: neodomus-api:1.0.0
    build: ../be
    environment:
      DATABASE_URL: "mysql+pymysql://neodomus:${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}@db:3306/neodomus?charset=utf8mb4"
      SECRET_KEY: "${SECRET_KEY:?Falta SECRET_KEY}"
      ENVIRONMENT: production
      FRONTEND_URL: http://localhost:8080
      # La API no publica puertos: solo el proxy web de este compose puede
      # alcanzarla, por lo que se confía en la red interna de Docker.
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_STORAGE_URI: "${RATE_LIMIT_STORAGE_URI:-memory://}"
      RATE_LIMIT_HEADERS_ENABLED: "${RATE_LIMIT_HEADERS_ENABLED:-true}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.16.0.0/12}"
      PAYMENT_PROVIDER: simulator
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: neodomus
      MINIO_SECRET_KEY: "${MINIO_PASSWORD:?Falta MINIO_PASSWORD}"
      MINIO_BUCKET: neodomus-media
      MINIO_PUBLIC_ENDPOINT: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: neodomus
      MYSQL_USER: neodomus
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u neodomus -p\"$$MYSQL_PASSWORD\" neodomus -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: elestio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: neodomus
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?Falta MINIO_PASSWORD}"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:
