[pytest]
# Todos los tests asíncronos se ejecutan automáticamente (no requiere el marcador).
asyncio_mode = auto
testpaths = app/tests
python_files = test_*.py
addopts = -ra --strict-markers
          --cov=app
          --cov-config=pyproject.toml
          --cov-report=term-missing
          --cov-report=html:htmlcov
