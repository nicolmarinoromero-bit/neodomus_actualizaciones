[project]
name = "neodomus-backend"
version = "1.0.0"
description = "Backend de Neodomus - Sistema de gestión de servicios técnicos"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.30",
    "pymysql==1.2.4",
    "python-dotenv==1.0.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.3.0",
    "PyJWT==2.15.1",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.30",
    "slowapi==0.1.9",
    "email-validator==2.1.0",
    "reportlab==4.2.0",
    "openpyxl==3.1.5",
    "Pillow==13.0.0",
    "alembic==1.13.2",
    "google-auth==2.35.0",
    "requests>=2.31.0",
    "minio>=7.2.20",
    "tzdata>=2026.3",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "coverage>=7.16.2",
    "pymupdf>=1.24,<2",
    # Runner de pruebas del bootcamp (Semana 2): pytest ejecuta además los
    # TestCase unittest heredados, así que conviven sin reescribir la suite.
    "pytest>=8.3,<10",
    "pytest-cov>=5.0,<7",
    "pytest-mock>=3.14,<4",
]

# ── Configuración de pytest (Semana 2 del bootcamp) ─────────────────────────
# - testpaths: la suite vive en app/tests (convención del proyecto).
# - addopts: cobertura por defecto (líneas+ramas) con umbral que sube por
#   semana (Semana 8: 80 % de piso; el trinquete lo fija a la cobertura real
#   anterior, que ya supera el 81 %).
[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]
branch = true

[tool.coverage.report]
# Piso vigente (Semana 8: 80 %; última medición real combinada 81.86 %). Sube
# cada semana por PR; nunca baja respecto a la medición real anterior.
fail_under = 80
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
