# Cobertura del bootcamp de testing de NeoDomus.
# Workflow INDEPENDIENTE de tests.yml y sonarcloud.yml (no los modifica).
#
# Objetivo de la Semana 8: publicar la cobertura real de frontend y backend
# como artefactos, aplicar el trinquete de 80 % y exigir 0 pruebas omitidas
# en el backend.
#
# Credenciales: SOLO cuentas dummy efímeras de CI (creadas y destruidas con
# cada job). Nunca credenciales de desarrollo o producción.

name: Cobertura (bootcamp)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-coverage:
    name: Frontend - cobertura y umbral 80
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Enable pnpm (versión fijada del repo)
        shell: bash
        working-directory: .
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('fe/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies (pnpm)
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run Vitest with coverage (thresholds en vitest.config.ts)
        shell: bash
        # --minWorkers/--maxWorkers evita falsos fallos por contención de CPU
        # en runners de 2 vCPU; el umbral vigente lo aplica el propio Vitest.
        run: pnpm exec vitest run --coverage --minWorkers=1 --maxWorkers=2 --testTimeout=60000

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-coverage-report
          path: |
            fe/coverage/lcov.info
            fe/coverage/coverage-summary.json
            fe/coverage/index.html
          if-no-files-found: warn

  backend-coverage:
    name: Backend - cobertura 80 y 0 omitidas
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start ephemeral MySQL (random CI password)
        shell: bash
        run: |
          root_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          app_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          minio_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$root_pw"
          echo "::add-mask::$app_pw"
          echo "::add-mask::$minio_pw"
          {
            echo "MYSQL_PASSWORD=$app_pw"
            echo "MINIO_ROOT_USER=ci_minio_user"
            echo "MINIO_ROOT_PASSWORD=$minio_pw"
            echo "TEST_MINIO_ENDPOINT=localhost:9000"
            echo "TEST_MINIO_PUBLIC_ENDPOINT=http://localhost:9000"
            echo "TEST_MINIO_ACCESS_KEY=ci_minio_user"
            echo "TEST_MINIO_SECRET_KEY=$minio_pw"
            echo "TEST_MINIO_BUCKET=neodomus-test-media"
            echo "TEST_MINIO_PRIVATE_BUCKET=neodomus-test-private"
            echo "DISABLE_SCHEDULER=1"
            echo "DATABASE_URL=mysql+pymysql://neodomus_ci_user:$app_pw@127.0.0.1:3306/neodomus_ci_app?charset=utf8mb4"
            echo "TEST_DATABASE_URL=mysql+pymysql://neodomus_ci_user:$app_pw@127.0.0.1:3306/neodomus_test?charset=utf8mb4"
          } >> "$GITHUB_ENV"
          docker run -d --name mysql-test \
            -e MYSQL_ROOT_PASSWORD="$root_pw" \
            -e MYSQL_DATABASE=neodomus_test \
            -e MYSQL_USER=neodomus_ci_user \
            -e MYSQL_PASSWORD="$app_pw" \
            -p 3306:3306 \
            mysql:8.0

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: be/uv.lock

      - name: Install locked backend dependencies
        shell: bash
        run: |
          python -m pip install --only-binary :all: 'uv==0.13.5'
          uv sync --locked --group dev --system --inexact --no-build --no-install-project --directory be

      - name: Generate ephemeral JWT secret (backend coverage CI only)
        shell: bash
        run: |
          secret="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$secret"
          echo "SECRET_KEY=$secret" >> "$GITHUB_ENV"

      - name: Start MinIO (server /data explícito)
        shell: bash
        run: |
          docker run -d --name minio-test \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            --health-cmd 'mc alias set ci http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && (mc ready ci || mc ls ci >/dev/null)' \
            --health-interval 5s --health-timeout 5s --health-retries 12 --health-start-period 5s \
            coollabsio/minio:RELEASE.2025-10-15T17-29-55Z \
            server /data --console-address ":9101"

      - name: Wait for MySQL
        shell: bash
        run: |
          python - <<'EOF'
          import os, time, pymysql
          for i in range(60):
              try:
                  pymysql.connect(host='127.0.0.1', port=3306, user='neodomus_ci_user',
                                  password=os.environ['MYSQL_PASSWORD'], connect_timeout=3)
                  print('MySQL listo')
                  break
              except Exception:
                  if i == 59:
                      raise
                  time.sleep(3)
          EOF

      - name: Wait for MinIO
        shell: bash
        run: |
          for i in $(seq 1 30); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' minio-test 2>/dev/null || echo missing)
            if [ "$estado" = "healthy" ]; then
              echo "MinIO listo (health=healthy)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO no alcanzó estado healthy"
          docker logs minio-test | tail -n 40
          exit 1

      - name: Create test buckets (dummy creds)
        shell: bash
        run: |
          python - <<'EOF'
          import os
          from minio import Minio
          c = Minio('localhost:9000', access_key=os.environ['TEST_MINIO_ACCESS_KEY'],
                    secret_key=os.environ['TEST_MINIO_SECRET_KEY'], secure=False)
          for b in ('neodomus-test-media', 'neodomus-test-private'):
              if not c.bucket_exists(b):
                  c.make_bucket(b)
              print('BUCKET', b, 'OK')
          EOF

      - name: Run backend migrations (Alembic head)
        shell: bash
        working-directory: be
        run: DATABASE_URL="$TEST_DATABASE_URL" python -m alembic upgrade head

      - name: Run pytest with coverage and JUnit report
        shell: bash
        working-directory: be
        # pyproject.toml aplica --cov=app --cov-branch --cov-fail-under=80;
        # aquí se añade HTML y JUnit para los artefactos.
        run: |
          set -o pipefail
          python -m pytest app/tests -q -rs \
            --cov-report=html \
            --junitxml=backend-junit.xml 2>&1 | tee backend-pytest.txt

      - name: Enforce zero skipped backend tests
        shell: bash
        working-directory: be
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse('backend-junit.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          print(f'Pruebas omitidas: {skipped}')
          if skipped:
              raise SystemExit('La suite backend no admite pruebas omitidas')
          EOF

      - name: Upload backend coverage artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-coverage-report
          path: |
            be/coverage.xml
            be/htmlcov
            be/backend-junit.xml
            be/backend-pytest.txt
          if-no-files-found: warn
