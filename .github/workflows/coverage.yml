# Cobertura del bootcamp de testing de NeoDomus.
# Workflow independiente de tests.yml que publica reportes para SonarCloud.
#
# Objetivo de la Semana 8: publicar la cobertura real de frontend, backend y
# móvil como artefactos, aplicar el trinquete de 80 % y exigir 0 pruebas
# omitidas en el backend.
#
# Credenciales: SOLO cuentas dummy efímeras de CI (creadas y destruidas con
# cada job). Nunca credenciales de desarrollo o producción.

name: Cobertura (bootcamp)

on:
  workflow_dispatch:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-coverage:
    name: Frontend - cobertura y umbral 80
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Enable pnpm (versión fijada del repo)
        shell: bash
        working-directory: .
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('fe/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies (pnpm)
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run Vitest with coverage (thresholds en vitest.config.ts)
        shell: bash
        # --minWorkers/--maxWorkers evita falsos fallos por contención de CPU
        # en runners de 2 vCPU; el umbral vigente lo aplica el propio Vitest.
        run: pnpm exec vitest run --coverage --minWorkers=1 --maxWorkers=2 --testTimeout=60000

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-report
          path: |
            fe/coverage/lcov.info
            fe/coverage/coverage-summary.json
            fe/coverage/index.html
          if-no-files-found: warn

  backend-coverage:
    name: Backend - cobertura 80 y 0 omitidas
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start ephemeral MySQL (runtime secret files)
        shell: bash
        run: |
          root_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          app_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          minio_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$root_pw"
          echo "::add-mask::$app_pw"
          echo "::add-mask::$minio_pw"
          umask 077
          printf '%s' "$root_pw" > "$RUNNER_TEMP/mysql_root_secret"
          printf '%s' "$app_pw" > "$RUNNER_TEMP/mysql_app_secret"
          printf '%s' "$minio_pw" > "$RUNNER_TEMP/minio_root_secret"
          chmod 644 "$RUNNER_TEMP/minio_root_secret"
          {
            echo "MINIO_ROOT_USER=ci_minio_user"
            echo "TEST_MINIO_ENDPOINT=localhost:9000"
            echo "TEST_MINIO_PUBLIC_ENDPOINT=http://localhost:9000"
            echo "TEST_MINIO_ACCESS_KEY=ci_minio_user"
            echo "TEST_MINIO_SECRET_KEY=$(cat "$RUNNER_TEMP/minio_root_secret")"
            echo "TEST_MINIO_BUCKET=neodomus-test-media"
            echo "TEST_MINIO_PRIVATE_BUCKET=neodomus-test-private"
            echo "DISABLE_SCHEDULER=1"
            echo "DATABASE_URL=mysql+pymysql://neodomus_ci_user:$app_pw@127.0.0.1:3306/neodomus_ci_app?charset=utf8mb4"
            echo "TEST_DATABASE_URL=mysql+pymysql://neodomus_ci_user:$app_pw@127.0.0.1:3306/neodomus_test?charset=utf8mb4"
          } >> "$GITHUB_ENV"
          docker run -d --name mysql-test \
            --mount type=bind,src="$RUNNER_TEMP/mysql_root_secret",dst=/run/secrets/mysql_root,readonly \
            --mount type=bind,src="$RUNNER_TEMP/mysql_app_secret",dst=/run/secrets/mysql_app,readonly \
            -e MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root \
            -e MYSQL_DATABASE=neodomus_test \
            -e MYSQL_USER=neodomus_ci_user \
            -e MYSQL_PASSWORD_FILE=/run/secrets/mysql_app \
            -p 3306:3306 \
            mysql:8.0

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: be/uv.lock

      - name: Install locked backend dependencies
        shell: bash
        run: |
          python -m pip install --only-binary :all: 'uv==0.13.5'
          uv sync --locked --group dev --inexact --no-build --no-install-project --directory be
          echo "$GITHUB_WORKSPACE/be/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/be/.venv" >> "$GITHUB_ENV"

      - name: Generate ephemeral JWT secret (backend coverage CI only)
        shell: bash
        run: |
          secret="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$secret"
          echo "SECRET_KEY=$secret" >> "$GITHUB_ENV"

      - name: Start MinIO (server /data explícito)
        shell: bash
        run: |
          docker run -d --name minio-test \
            -p 9000:9000 \
            --mount type=bind,src="$RUNNER_TEMP/minio_root_secret",dst=/run/secrets/minio_root,readonly \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_root \
            --health-cmd 'mc alias set ci http://localhost:9000 "$MINIO_ROOT_USER" "$(cat /run/secrets/minio_root)" >/dev/null 2>&1 && (mc ready ci || mc ls ci >/dev/null)' \
            --health-interval 5s --health-timeout 5s --health-retries 12 --health-start-period 5s \
            coollabsio/minio:RELEASE.2025-10-15T17-29-55Z \
            server /data --console-address ":9101"

      - name: Wait for MySQL
        shell: bash
        run: |
          python - <<'EOF'
          import os, time, pymysql
          from urllib.parse import unquote, urlparse
          u = urlparse(os.environ['TEST_DATABASE_URL'])
          for i in range(60):
              try:
                  pymysql.connect(host=u.hostname, port=u.port or 3306,
                                  user=unquote(u.username), password=unquote(u.password),
                                  connect_timeout=3)
                  print('MySQL listo')
                  break
              except Exception:
                  if i == 59:
                      raise
                  time.sleep(3)
          EOF

      - name: Wait for MinIO
        shell: bash
        run: |
          for i in $(seq 1 30); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' minio-test 2>/dev/null || echo missing)
            if [ "$estado" = "healthy" ]; then
              echo "MinIO listo (health=healthy)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO no alcanzó estado healthy"
          docker logs minio-test | tail -n 40
          exit 1

      - name: Create test buckets (dummy creds)
        shell: bash
        run: |
          python - <<'EOF'
          import os
          from minio import Minio
          c = Minio('localhost:9000', access_key=os.environ['TEST_MINIO_ACCESS_KEY'],
                    secret_key=os.environ['TEST_MINIO_SECRET_KEY'], secure=False)
          for b in ('neodomus-test-media', 'neodomus-test-private'):
              if not c.bucket_exists(b):
                  c.make_bucket(b)
              print('BUCKET', b, 'OK')
          EOF

      - name: Run backend migrations (Alembic head)
        shell: bash
        working-directory: be
        run: DATABASE_URL="$TEST_DATABASE_URL" python -m alembic upgrade head

      - name: Run pytest with coverage and JUnit report
        shell: bash
        working-directory: be
        # pyproject.toml aplica --cov=app --cov-branch --cov-fail-under=80;
        # aquí se añade HTML y JUnit para los artefactos.
        run: |
          set -o pipefail
          python -m pytest app/tests -q -rs \
            --cov-report=html \
            --junitxml=backend-junit.xml 2>&1 | tee backend-pytest.txt

      - name: Enforce zero skipped backend tests
        shell: bash
        working-directory: be
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse('backend-junit.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          print(f'Pruebas omitidas: {skipped}')
          if skipped:
              raise SystemExit('La suite backend no admite pruebas omitidas')
          EOF

      - name: Upload backend coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-report
          path: |
            be/coverage.xml
            be/htmlcov
            be/backend-junit.xml
            be/backend-pytest.txt
          if-no-files-found: warn

  movil-coverage:
    name: Movil - cobertura y trinquete
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: movil

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Misma versión de pnpm que usa SonarCloud para instalar movil.
      - name: Enable pnpm (versión fija del análisis móvil)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('movil/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install mobile dependencies (pnpm)
        shell: bash
        run: pnpm install --frozen-lockfile

      # El umbral lo aplica el propio Jest (coverageThreshold en
      # movil/jest.config.js): trinquete de líneas/sentencias ≥ 90 %.
      - name: Run Jest with coverage
        shell: bash
        run: pnpm run test:coverage

      # Jest escribe las rutas del lcov relativas a movil/ (rootDir del
      # proyecto); SonarCloud resuelve las rutas de SF: desde la raíz del
      # repositorio, así que se antepone el prefijo "movil/" (mismo trato
      # que Sonar da a las rutas absolutas del lcov de Vitest en fe).
      - name: Rewrite lcov paths for Sonar
        shell: bash
        run: sed -i 's|^SF:|SF:movil/|' coverage/lcov.info

      - name: Upload mobile coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: movil-coverage-report
          path: |
            movil/coverage/lcov.info
            movil/coverage/coverage-summary.json
          if-no-files-found: warn
