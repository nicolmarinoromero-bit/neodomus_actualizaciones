# ╔══════════════════════════════════════════════════════════════════════╗
#  NEODOMUS - Workflows de pruebas (CI).  Archivo INDEPENDIENTE del
#  workflow de SonarCloud (no tocar .github/workflows/sonarcloud.yml).
#
#  - Backend: unittest sobre una base MySQL efímera del runner + MinIO de
#    pruebas efímero (credenciales CI dummy, NUNCA las del desarrollo).
#  - Frontend: Vitest con pnpm.
#  - Móvil: Jest (jest-expo + React Native Testing Library), sin BD ni red
#    (red/mock de AsyncStorage en memoria; no llama al backend real).
#  - E2E: job SEPARADO que ejecuta directamente los orquestadores
#    `scripts/e2e_*.py` (el runner `tests/run_e2e_tests.ps1` es Windows-
#    only: valida Chromium vía %LOCALAPPDATA%; NO se modifica para Linux).
#
#  Versión & docs: ver tests/README.md (sección “GitHub Actions”).
#
#  Credenciales: SOLO cuentas dummy efímeras definidas aquí (p. ej.
#  neodomus_ci_user), creadas y destruidas con el job. Nunca secretos del
#  desarrollo; nada se imprime en consola.
# ╚══════════════════════════════════════════════════════════════════════╝

name: Neodomus Tests

on:
  # CI también corre en ramas de integración; los tags se validan en release.yml.
  push:
    branches: ["**"]
  # PR hacia las ramas de integración principales
  pull_request:
    branches: [development, master, main]
  # Ejecución manual
  workflow_dispatch:

# Evita corridas duplicadas del mismo ref (no ejecuta E2E dos veces)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────── FRONTEND ──────────────────────────────
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Enable pnpm (corepack, version pinnada del repo local)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('fe/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies (pnpm)
        shell: bash
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests (runner existente via pwsh)
        shell: pwsh
        run: |
          Write-Host "Node: $(& node --version) · Pnpm: $(& pnpm --version)"
          pwsh -NoProfile -File ./tests/run_frontend_tests.ps1 2>&1 | Tee-Object -FilePath ci_fe_output.log
          exit $LASTEXITCODE

      - name: Upload FE log (solo en fallo)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-frontend-log
          path: ci_fe_output.log
          if-no-files-found: ignore

  # ───────────────────────────────── MÓVIL ──────────────────────────────
  # Mismo patrón que frontend: runner existente via pwsh, sin BD ni red.
  # pnpm 12.3.4 = versión con la que sonarcloud.yml/coverage.yml instalan
  # movil (fe usa 11.4.0 por su campo packageManager; movil no lo declara).
  movil:
    name: Movil (Jest + jest-expo)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Enable pnpm (corepack, versión pinnada de los workflows de movil)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-movil-${{ runner.os }}-${{ hashFiles('movil/pnpm-lock.yaml') }}
          restore-keys: pnpm-movil-${{ runner.os }}-

      - name: Install dependencies (pnpm)
        shell: bash
        working-directory: movil
        run: pnpm install --frozen-lockfile

      - name: Run movil tests (runner existente via pwsh)
        shell: pwsh
        run: |
          Write-Host "Node: $(& node --version) · Pnpm: $(& pnpm --version)"
          pwsh -NoProfile -File ./tests/run_movil_tests.ps1 2>&1 | Tee-Object -FilePath ci_movil_output.log
          exit $LASTEXITCODE

      - name: Upload movil log (solo en fallo)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-movil-log
          path: ci_movil_output.log
          if-no-files-found: ignore

  # ──────────────────────────────── BACKEND ─────────────────────────────
  backend:
    name: Backend (unittest + MySQL/MinIO efímeros)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start ephemeral MySQL (runtime secret files)
        shell: bash
        run: |
          root_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          app_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          minio_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$root_pw"
          echo "::add-mask::$app_pw"
          echo "::add-mask::$minio_pw"
          umask 077
          printf '%s' "$root_pw" > "$RUNNER_TEMP/mysql_root_secret"
          printf '%s' "$app_pw" > "$RUNNER_TEMP/mysql_app_secret"
          printf '%s' "$minio_pw" > "$RUNNER_TEMP/minio_root_secret"
          chmod 644 "$RUNNER_TEMP/minio_root_secret"
          {
            echo "MINIO_ROOT_USER=ci_minio_user"
            echo "TEST_MINIO_ENDPOINT=localhost:9000"
            echo "TEST_MINIO_PUBLIC_ENDPOINT=http://localhost:9000"
            echo "TEST_MINIO_ACCESS_KEY=ci_minio_user"
            echo "TEST_MINIO_SECRET_KEY=$(cat "$RUNNER_TEMP/minio_root_secret")"
            echo "TEST_MINIO_BUCKET=neodomus-test-media"
            echo "TEST_MINIO_PRIVATE_BUCKET=neodomus-test-private"
            echo "DISABLE_SCHEDULER=1"
            echo "DATABASE_URL=mysql+pymysql://neodomus_ci_user:$app_pw@127.0.0.1:3306/neodomus_ci_app?charset=utf8mb4"
            echo "TEST_DATABASE_URL=mysql+pymysql://neodomus_ci_user:$app_pw@127.0.0.1:3306/neodomus_test?charset=utf8mb4"
          } >> "$GITHUB_ENV"
          docker run -d --name mysql-test \
            --mount type=bind,src="$RUNNER_TEMP/mysql_root_secret",dst=/run/secrets/mysql_root,readonly \
            --mount type=bind,src="$RUNNER_TEMP/mysql_app_secret",dst=/run/secrets/mysql_app,readonly \
            -e MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root \
            -e MYSQL_DATABASE=neodomus_test \
            -e MYSQL_USER=neodomus_ci_user \
            -e MYSQL_PASSWORD_FILE=/run/secrets/mysql_app \
            -p 3306:3306 \
            mysql:8.0

      - name: "Setup Python 3.12 (spec: be/Dockerfile)"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: be/uv.lock

      - name: Install locked backend dependencies
        shell: bash
        run: |
          python -m pip install --only-binary :all: 'uv==0.13.5'
          uv sync --locked --group dev --inexact --no-build --no-install-project --directory be
          echo "$GITHUB_WORKSPACE/be/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/be/.venv" >> "$GITHUB_ENV"

      - name: Generate ephemeral JWT secret (backend CI only)
        shell: bash
        run: |
          secret="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$secret"
          echo "SECRET_KEY=$secret" >> "$GITHUB_ENV"

      # MinIO de pruebas: los service containers de GitHub Actions no admiten
      # campo 'command' y la imagen arrancada sin 'server /data' imprime su
      # ayuda y muere (run 43106631303). Se lanza como paso controlado con el
      # comando explícito que usa docker-compose.test.yml; misma release fija.
      - name: Start MinIO (comando explícito server /data)
        shell: bash
        run: |
          docker run -d --name minio-test \
            -p 9000:9000 \
            --mount type=bind,src="$RUNNER_TEMP/minio_root_secret",dst=/run/secrets/minio_root,readonly \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_root \
            --health-cmd 'mc alias set ci http://localhost:9000 "$MINIO_ROOT_USER" "$(cat /run/secrets/minio_root)" >/dev/null 2>&1 && (mc ready ci || mc ls ci >/dev/null)' \
            --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 30s \
            coollabsio/minio:RELEASE.2025-10-15T17-29-55Z \
            server /data --console-address ":9101"

      - name: Wait for MySQL (servicio CI, sin imprimir credenciales)
        shell: bash
        run: |
          python - <<'EOF'
          import os, time, pymysql
          from urllib.parse import unquote, urlparse
          u = urlparse(os.environ['TEST_DATABASE_URL'])
          for i in range(60):
              try:
                  pymysql.connect(host=u.hostname, port=u.port or 3306,
                                  user=unquote(u.username), password=unquote(u.password),
                                  connect_timeout=3)
                  print('MySQL listo')
                  break
              except Exception:
                  if i == 59:
                      raise
                  time.sleep(3)
          EOF

      - name: Wait for MinIO (health real; muestra logs si falla)
        shell: bash
        run: |
          for i in $(seq 1 30); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' minio-test 2>/dev/null || echo missing)
            if [ "$estado" = "healthy" ]; then
              echo "MinIO listo (health=healthy) tras $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO no alcanzó estado healthy"
          docker logs minio-test | tail -n 40
          docker ps -a --filter name=minio-test
          exit 1

      - name: Create test buckets en MinIO (dummy creds, sin secretos)
        shell: bash
        run: |
          python - <<'EOF'
          import os
          from minio import Minio
          c = Minio('localhost:9000', access_key=os.environ['TEST_MINIO_ACCESS_KEY'], secret_key=os.environ['TEST_MINIO_SECRET_KEY'], secure=False)
          for b in ('neodomus-test-media', 'neodomus-test-private'):
              if not c.bucket_exists(b):
                  c.make_bucket(b)
              print('BUCKET', b, 'OK')
          EOF

      - name: Run backend migrations (Alembic head, base CI)
        shell: bash
        # alembic.ini vive en be/ (script_location relativo al ini)
        working-directory: be
        run: DATABASE_URL="$TEST_DATABASE_URL" python -m alembic upgrade head

      - name: Run backend tests (runner existente via pwsh)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tests/run_backend_tests.ps1 2>&1 | Tee-Object -FilePath ci_be_output.log
          exit $LASTEXITCODE

      - name: Upload BE log (solo en fallo)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-backend-log
          path: ci_be_output.log
          if-no-files-found: ignore

  # ─────────────────────────────────── E2E ──────────────────────────────
  e2e:
    name: E2E (Playwright sobre 6 flujos)
    runs-on: ubuntu-24.04
    needs: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start ephemeral MySQL (runtime secret files)
        shell: bash
        run: |
          root_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          app_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          minio_pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$root_pw"
          echo "::add-mask::$app_pw"
          echo "::add-mask::$minio_pw"
          umask 077
          printf '%s' "$root_pw" > "$RUNNER_TEMP/mysql_root_secret"
          printf '%s' "$app_pw" > "$RUNNER_TEMP/mysql_app_secret"
          printf '%s' "$minio_pw" > "$RUNNER_TEMP/minio_root_secret"
          chmod 644 "$RUNNER_TEMP/minio_root_secret"
          {
            echo "MINIO_ROOT_USER=ci_minio_user"
            echo "TEST_MINIO_ENDPOINT=localhost:9000"
            echo "TEST_MINIO_PUBLIC_ENDPOINT=http://localhost:9000"
            echo "TEST_MINIO_ACCESS_KEY=ci_minio_user"
            echo "TEST_MINIO_SECRET_KEY=$(cat "$RUNNER_TEMP/minio_root_secret")"
            echo "TEST_MINIO_BUCKET=neodomus-test-media"
            echo "TEST_MINIO_PRIVATE_BUCKET=neodomus-test-private"
            echo "DISABLE_SCHEDULER=1"
            echo "DATABASE_URL=mysql+pymysql://neodomus_ci_user:$app_pw@127.0.0.1:3306/neodomus_ci_app?charset=utf8mb4"
            echo "TEST_DATABASE_URL=mysql+pymysql://neodomus_ci_user:$app_pw@127.0.0.1:3306/neodomus_test?charset=utf8mb4"
          } >> "$GITHUB_ENV"
          docker run -d --name mysql-test \
            --mount type=bind,src="$RUNNER_TEMP/mysql_root_secret",dst=/run/secrets/mysql_root,readonly \
            --mount type=bind,src="$RUNNER_TEMP/mysql_app_secret",dst=/run/secrets/mysql_app,readonly \
            -e MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root \
            -e MYSQL_DATABASE=neodomus_test \
            -e MYSQL_USER=neodomus_ci_user \
            -e MYSQL_PASSWORD_FILE=/run/secrets/mysql_app \
            -p 3306:3306 \
            mysql:8.0

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Enable pnpm (corepack, version pinnada del repo local)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('fe/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install FE deps (para Vite efimero de orquestadores)
        shell: bash
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: be/uv.lock

      - name: Install locked backend dependencies (orquestadores E2E)
        shell: bash
        run: |
          python -m pip install --only-binary :all: 'uv==0.13.5'
          uv sync --locked --group dev --inexact --no-build --no-install-project --directory be
          echo "$GITHUB_WORKSPACE/be/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/be/.venv" >> "$GITHUB_ENV"

      - name: Generate ephemeral JWT secret (E2E CI only)
        shell: bash
        run: |
          secret="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$secret"
          echo "SECRET_KEY=$secret" >> "$GITHUB_ENV"

      # Misma solución que el job backend: paso controlado con 'server /data'
      # explícito (los service containers no admiten campo 'command').
      - name: Start MinIO (comando explícito server /data)
        shell: bash
        run: |
          docker run -d --name minio-test \
            -p 9000:9000 \
            --mount type=bind,src="$RUNNER_TEMP/minio_root_secret",dst=/run/secrets/minio_root,readonly \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_root \
            --health-cmd 'mc alias set ci http://localhost:9000 "$MINIO_ROOT_USER" "$(cat /run/secrets/minio_root)" >/dev/null 2>&1 && (mc ready ci || mc ls ci >/dev/null)' \
            --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 30s \
            coollabsio/minio:RELEASE.2025-10-15T17-29-55Z \
            server /data --console-address ":9101"

      - name: Wait for MySQL (sin imprimir credenciales)
        shell: bash
        run: |
          python - <<'EOF'
          import os, time, pymysql
          from urllib.parse import unquote, urlparse
          u = urlparse(os.environ['TEST_DATABASE_URL'])
          for i in range(60):
              try:
                  pymysql.connect(host=u.hostname, port=u.port or 3306,
                                  user=unquote(u.username), password=unquote(u.password),
                                  connect_timeout=3)
                  print('MySQL listo')
                  break
              except Exception:
                  if i == 59:
                      raise
                  time.sleep(3)
          EOF

      - name: Wait for MinIO (health real; muestra logs si falla)
        shell: bash
        run: |
          for i in $(seq 1 30); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' minio-test 2>/dev/null || echo missing)
            if [ "$estado" = "healthy" ]; then
              echo "MinIO listo (health=healthy) tras $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO no alcanzó estado healthy"
          docker logs minio-test | tail -n 40
          docker ps -a --filter name=minio-test
          exit 1

      - name: Run backend migrations (base CI)
        shell: bash
        # alembic.ini vive en be/ (script_location relativo al ini)
        working-directory: be
        run: DATABASE_URL="$TEST_DATABASE_URL" python -m alembic upgrade head

      - name: Create E2E buckets (dummy)
        shell: bash
        run: |
          python - <<'EOF'
          import os
          from minio import Minio
          c = Minio('localhost:9000', access_key=os.environ['TEST_MINIO_ACCESS_KEY'], secret_key=os.environ['TEST_MINIO_SECRET_KEY'], secure=False)
          for b in ('neodomus-test-media', 'neodomus-test-private'):
              if not c.bucket_exists(b):
                  c.make_bucket(b)
              print('BUCKET', b, 'OK')
          EOF

      # Usa el binario local de @playwright/test (lockfile), nunca una descarga
      # on-demand de npx (Sonar: npx puede ejecutar lifecycle scripts).
      - name: Install Chromium + deps del sistema
        shell: bash
        working-directory: fe
        run: pnpm exec playwright install --with-deps chromium

      # Los 6 flujos con orquestador, SEGUIDOS (sin detenerse al primer fallo)
      # para reportar TODOS los resultados exit/códigos. E2E job corre una sola
      # vez por ref (concurrency) y NO reutiliza run_e2e_tests.ps1 (Windows-only).
      - name: Run the 6 E2E flows (resultados por flujo)
        shell: bash
        id: e2e
        env:
          # DATABASE_URL y TEST_DATABASE_URL vienen de GITHUB_ENV: se generan
          # con la contraseña aleatoria del MySQL de este job.
          DISABLE_SCHEDULER: '1'
          CI: 'true'
        run: |
          set +e
          FAILED=0
          FAILED_COUNT=0
          FLOWS="cart-checkout register session admin-paginacion foto-tecnico reporte-ventas"
          : > e2e_results.txt
          for f in $FLOWS; do
            script="scripts/e2e_${f//-/_}.py"
            echo "== FLUJO $f ==" | tee -a e2e_results.txt
            python "$script" > "e2e_${f}.log" 2>&1
            rc=$?
            echo "== EXIT $f=$rc ==" | tee -a e2e_results.txt
            if [ "$rc" -ne 0 ]; then
              FAILED=1
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          done
          echo "== RESUMEN ==" | tee -a e2e_results.txt
          cat e2e_results.txt
          echo "E2E_FAILED=$FAILED" >> "$GITHUB_OUTPUT"
          echo "E2E_FAILED_COUNT=$FAILED_COUNT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Exit with global E2E code
        shell: bash
        run: |
          if [ "${{ steps.e2e.outputs.E2E_FAILED }}" != "0" ]; then
            echo "E2E falló en ${{ steps.e2e.outputs.E2E_FAILED_COUNT }} flujo(s)"; exit 1
          fi
          echo "E2E OK"

      - name: Failure summary (listar flujos con su código)
        if: always()
        shell: bash
        run: |
          echo "### Resultados E2E" >> "${GITHUB_STEP_SUMMARY:-./gh_step_summary.md}"
          cat e2e_results.txt >> "${GITHUB_STEP_SUMMARY:-./gh_step_summary.md}" || true
          echo -e "\n### Log maestro de cada flujo\n" >> "${GITHUB_STEP_SUMMARY:-./gh_step_summary.md}"
          tail -n 20 e2e_*.log >> "${GITHUB_STEP_SUMMARY:-./gh_step_summary.md}" || true

      - name: "Upload E2E artifacts (siempre: result + logs por flujo)"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            e2e_results.txt
            e2e_*.log
          if-no-files-found: ignore
          retention-days: 7
