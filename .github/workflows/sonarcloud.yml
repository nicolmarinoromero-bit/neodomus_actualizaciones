# SonarCloud analiza la misma revisión después de que Cobertura (bootcamp)
# haya generado los reportes LCOV y Cobertura XML requeridos por la puerta.
name: SonarCloud Analysis

on:
  workflow_run:
    workflows: ["Cobertura (bootcamp)"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout analyzed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download frontend coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage-report
          path: fe/coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download backend coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage-report
          path: be
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download mobile coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: movil-coverage-report
          path: movil/coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate coverage reports
        shell: bash
        run: |
          test -s fe/coverage/lcov.info || { echo "::error::Falta fe/coverage/lcov.info"; exit 1; }
          test -s be/coverage.xml || { echo "::error::Falta be/coverage.xml"; exit 1; }
          test -s movil/coverage/lcov.info || { echo "::error::Falta movil/coverage/lcov.info"; exit 1; }

      # Sonar requiere tsconfig resolubles, pero no vuelve a ejecutar pruebas.
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Enable pnpm para frontend
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install frontend dependencies
        shell: bash
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Enable pnpm para móvil
        shell: bash
        run: corepack prepare pnpm@12.3.4 --activate

      - name: Install mobile dependencies
        shell: bash
        working-directory: movil
        run: pnpm install --frozen-lockfile

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: >-
            ${{ github.event.workflow_run.event == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.head_branch, github.event.workflow_run.pull_requests[0].base.ref) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
