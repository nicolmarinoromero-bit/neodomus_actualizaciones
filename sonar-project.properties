sonar.projectKey=nicolmarinoromero-bit_neodomus_actualizaciones
sonar.organization=nicolmarinoromero-bit
sonar.sources=.
sonar.sourceEncoding=UTF-8
# Reportes generados por Cobertura (bootcamp) y consumidos en la misma revisión.
# El lcov de móvil lo produce el job "Movil - cobertura y trinquete".
sonar.javascript.lcov.reportPaths=fe/coverage/lcov.info,movil/coverage/lcov.info
sonar.python.coverage.reportPaths=be/coverage.xml
# Versión de Python usada en tiempo de ejecución (be/Dockerfile: python:3.12-slim)
sonar.python.version=3.12
# Código de pruebas (Python, frontend y móvil)
sonar.tests=be/app/tests,tests,fe/src,fe/e2e,movil/__tests__,scripts
sonar.test.inclusions=be/app/tests/**/*.py,tests/**/*.ps1,fe/src/**/*.test.ts,fe/src/**/*.test.tsx,fe/e2e/**/*.spec.ts,movil/__tests__/**/*.test.ts,movil/__tests__/**/*.test.tsx,scripts/e2e_*.py
# tsconfig del frontend y móvil (requiere dependencias instaladas)
sonar.typescript.tsconfigPaths=fe/tsconfig.json,fe/tsconfig.app.json,fe/tsconfig.node.json,movil/tsconfig.json
# Opciones adicionales de exclusión de archivos.
# Los .sql del proyecto son scripts de despliegue MySQL, no PL/SQL: se excluyen
# para que el analizador PL/SQL no exija un Data Dictionary de Oracle.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/dist/**,**/*.sql
# Datos repetidos intencionalmente entre plataformas, traducciones y revisiones históricas.
sonar.cpd.exclusions=fe/src/i18n/legalHomeTranslations.ts,fe/src/i18n/authTranslations.ts,fe/src/i18n/profileTabsTranslations.ts,fe/src/i18n/adminTranslations-consultas.ts,fe/src/i18n/translations.ts,fe/src/i18n/adminTranslations-reportes.ts,movil/contexts/translations/**,fe/src/pages/legal/*.tsx,movil/app/privacidad.tsx,movil/app/terminos.tsx,movil/app/cookies.tsx,be/alembic/versions/**
